[project]
name = "childhood-haven-agent"
version = "0.1.0"
description = "Agent backend for 童心驿站"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<5",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "postgres: requires TEST_DATABASE_URL and a migrated PostgreSQL database",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

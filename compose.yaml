services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: childhood_haven
      POSTGRES_USER: childhood_haven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childhood_haven -d childhood_haven"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      MODEL_PROVIDER: bailian
      DATABASE_URL: postgresql://childhood_haven:${POSTGRES_PASSWORD}@postgres:5432/childhood_haven
      APP_API_TOKEN: ${APP_API_TOKEN}
      LANGGRAPH_STRICT_MSGPACK: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: childhood_haven
      POSTGRES_USER: childhood_haven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childhood_haven -d childhood_haven"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${DEPLOY_ENV:-staging}
      MODEL_PROVIDER: ${DEPLOY_MODEL_PROVIDER:-mock}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: childhood_haven
      DB_USER: childhood_haven
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_API_TOKEN: ${APP_API_TOKEN:?Set APP_API_TOKEN in .env}
      LANGGRAPH_STRICT_MSGPACK: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
